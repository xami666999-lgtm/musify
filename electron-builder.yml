appId: com.musify.player
productName: Musify
executableName: musify
artifactName: ${productName}-Setup-${version}.${ext}
directories:
  output: release
  buildResources: desktop
files:
  - "!**/*"
  - desktop/main.mjs
  - desktop/preload.cjs
  - package.json
extraResources:
  - from: .output
    to: server
extraMetadata:
  main: desktop/main.mjs
  name: musify
  description: Musify desktop player
asar: true
toolsets:
  wine: "1.0.1"
  nsis: "1.2.1"
linux:
  target:
    - deb
    - AppImage
  category: Audio
  icon: desktop/icon.png
  synopsis: Music player
  maintainer: Musify
  syncDesktopName: true
win:
  target:
    - nsis
  icon: desktop/icon.png
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Musify
  uninstallDisplayName: Musify
  installerIcon: desktop/icon.ico
  uninstallerIcon: desktop/icon.ico
mac:
  target:
    - dmg
  category: public.app-category.music
  icon: desktop/icon.png
dmg:
  title: Musify Setup
