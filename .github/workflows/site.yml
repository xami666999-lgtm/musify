name: Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/site.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          PAGES: "1"
          VITE_PAGES: "1"
      - name: Publish the site branch
        run: |
          test -f .vercel/output/static/.html
          cp .vercel/output/static/.html .vercel/output/static/index.html
          cd .vercel/output/static
          git init
          git checkout -b site
          git add -A
          git -c user.name=xami666999-lgtm -c user.email=308808809+xami666999-lgtm@users.noreply.github.com commit -m "Publish Mxsify site"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/xami666999-lgtm/musify.git" site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
