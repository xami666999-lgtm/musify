name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build app
        shell: bash
        run: npm run desktop:build
      - name: Package installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --title "Musify $VERSION" --notes "Settings checks GitHub for updates. A desktop shortcut is created when Musify opens."
          fi
          gh release upload "v$VERSION" "release/Musify-Setup-$VERSION.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
